services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_USER: vinfast
      CLICKHOUSE_PASSWORD: vinfast123
      CLICKHOUSE_DB: vinfast
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # S3 API substitute bằng Moto (minio/minio + minio/mc đã bị gỡ khỏi Docker Hub,
    # quay.io chặn pull ẩn danh, dl.min.io trả 410). Giữ tên service + port S3 9000
    # để SQL s3('http://minio:9000/...') của ClickHouse không đổi. Không còn console UI :9101.
    image: motoserver/moto:5.2.3
    entrypoint: moto_server
    command: -H 0.0.0.0 -p 9000
    ports:
      - "9100:9000"
    environment:
      MINIO_ROOT_USER: vinfast
      MINIO_ROOT_PASSWORD: vinfast123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/moto-api/', timeout=3)\""]
      interval: 5s
      timeout: 3s
      retries: 20

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
      JAVA_TIMEZONE: Asia/Ho_Chi_Minh
      MB_PLUGINS_DIR: /plugins
    volumes:
      - ./Vinfast_v1/metabase/plugins:/plugins
      - metabase_data:/metabase-data
    depends_on:
      clickhouse:
        condition: service_healthy

  mageai:
    build:
      context: ./mage
      dockerfile: Dockerfile.mage
    ports: ["6789:6789"]
    env_file: .env
    environment:
      MINIO_ENDPOINT: http://minio:9000
      CLICKHOUSE_HOST: clickhouse
      MAGE_LOG_DIR: /home/src/logs
      PYTHONPATH: /home/code:/home/code/src
    volumes:
      - ./Vinfast_v1:/home/code
      - ./mage/pipelines:/home/mage/pipelines
      - ./logs:/home/src/logs
      - ./data:/home/code/data
    depends_on:
      minio: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:6789/health"]
      interval: 30s
      timeout: 10s
      retries: 5

