name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff pyyaml
      - run: ruff check mage tests scripts
      - run: python -m compileall -q Vinfast_v1/src mage
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r Vinfast_v1/requirements.txt pytest pyyaml
      - run: pytest -q tests/test_compose.py tests/test_blocks.py tests/test_qc_gate.py tests/test_backfill.py
  dbt:
    runs-on: ubuntu-latest
    env:
      MINIO_ENDPOINT: http://localhost:9100
      MINIO_ROOT_USER: vinfast
      MINIO_ROOT_PASSWORD: vinfast123
      S3_ADDRESSING_STYLE: path
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_USER: vinfast
      CLICKHOUSE_PASSWORD: vinfast123
      CLICKHOUSE_DB: vinfast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r Vinfast_v1/requirements.txt
      - name: Start s3 mock and clickhouse
        run: |
          docker run -d --name minio -p 9100:9000 \
            --entrypoint moto_server \
            motoserver/moto:5.2.3 s3 -H 0.0.0.0 -p 9000
          docker run -d --name clickhouse --link minio:minio -p 8123:8123 -p 9000:9000 \
            -e CLICKHOUSE_USER=vinfast -e CLICKHOUSE_PASSWORD=vinfast123 -e CLICKHOUSE_DB=vinfast \
            clickhouse/clickhouse-server:24.8
          for i in $(seq 1 30); do
            curl -sf http://localhost:9100/moto-api/ && break || sleep 2
          done
          for i in $(seq 1 30); do
            docker exec clickhouse clickhouse-client --query "SELECT 1" && break || sleep 2
          done
      - name: Create buckets
        run: |
          python -c "
          import boto3
          from botocore.config import Config
          s3 = boto3.client('s3', endpoint_url='http://localhost:9100',
                            aws_access_key_id='vinfast', aws_secret_access_key='vinfast123',
                            region_name='us-east-1',
                            config=Config(s3={'addressing_style': 'path'}))
          for b in ['vinfast-bronze', 'vinfast-silver', 'vinfast-gold']:
              try:
                  s3.create_bucket(Bucket=b)
              except s3.exceptions.BucketAlreadyOwnedByYou:
                  pass
          print(s3.list_buckets()['Buckets'])
          "
      - run: python -m src.data_generator.cli generate --start-date 2026-08-10 --end-date 2026-08-10 --vehicles 5 --seed 42
        working-directory: Vinfast_v1
      - run: python -m src.data_generator.cli mock-raw --source all --seed 42
        working-directory: Vinfast_v1
      - run: python -m src.pipeline.cli run --all --date 2026-08-10
        working-directory: Vinfast_v1
      - run: python -m dbt.cli.main deps --profiles-dir . && python -m dbt.cli.main run --profiles-dir . --target docker && python -m dbt.cli.main test --profiles-dir . --target docker
        working-directory: Vinfast_v1/dbt_project
